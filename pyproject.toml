[project]
name = "deckx"
version = "0.1.0"
description = "Markdown slide decks rendered in the browser, with a print stylesheet that makes PDF export work."
readme = "README.md"
license = "MIT"
authors = [{ name = "Samuel Colvin", email = "s@muelcolvin.com" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deckx = "deckx.build:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120
include = ["backend/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = [
    "Q",      # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "RUF100", # https://docs.astral.sh/ruff/rules/unused-noqa/
    "I",      # https://docs.astral.sh/ruff/rules/#isort-i
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["deckx"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
include = ["backend", "tests"]
extraPaths = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
