fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # Lock files and built artifacts are full of "package-name-shaped" tokens that look like typos.
        exclude: '(^|/)(bun\.lock|package-lock\.json|dist/|node_modules/)'

  - repo: local
    hooks:
      - id: format
        name: Format
        entry: bun run format
        language: system
        pass_filenames: false
      - id: typecheck
        name: Typecheck
        entry: bun run typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
